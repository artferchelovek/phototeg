services:
  postgres:
    image: postgres:16-alpine
    container_name: phototeg_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      POSTGRES_DB: ${POSTGRES_DB:-phototeg}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-phototeg}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: phototeg_server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-4000}:4000"
    env_file:
      - ./server/.env
      - .env
    environment:
      NODE_ENV: development
      PORT: ${SERVER_PORT:-4000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://myuser:mypassword@postgres:5432/phototeg?schema=public}
      JWT_SECRET: ${JWT_SECRET:-super-secret-nobody-can-crack}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_network

  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phototeg_client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    depends_on:
      - server
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
